name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
pr: none

resources:
  repositories:
    - repository: templates
      type: github
      name: microsoft/vscode-engineering
      ref: chrmarti/sheer-fly
      endpoint: Monaco

parameters:
  - name: publishPackage
    displayName: 🚀 Publish vscode-proxy-agent
    type: boolean
    default: false

extends:
  template: azure-pipelines/npm-package/pipeline.yml@templates
  parameters:
    npmPackages:
      - name: vscode-proxy-agent

        buildSteps:
          - script: npm ci
            displayName: Install dependencies
          - script: npm run compile
            displayName: Compile
        
        testPlatforms: {}
        publishPackage: ${{ parameters.publishPackage }}
        tag: next
        ghCreateTag: false
        ghCreateRelease: false
        ghReleaseAddChangeLog: false
